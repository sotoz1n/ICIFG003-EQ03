<div style="padding: 30px; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; min-height: 100vh;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h2 style="color: #2c3e50; margin: 0;">📋 Catálogo de Tratamientos</h2>
    <button (click)="irAMenu()" style="background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;">
      Volver al Panel
    </button>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 30px;">
    
    <div *ngIf="esAdmin" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: fit-content;">
      <h3 style="color: #007bff; margin-top: 0; margin-bottom: 20px; text-align: center;">
        {{ editando ? 'Editar Tratamiento' : 'Nuevo Tratamiento' }}
      </h3>
      
      <form (ngSubmit)="guardar()">
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 600;">Nombre:</label>
          <input type="text" [(ngModel)]="nuevoTratamiento.nombre" name="nombre" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 600;">Descripción:</label>
          <textarea [(ngModel)]="nuevoTratamiento.descripcion" name="descripcion" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; height: 80px; box-sizing: border-box;"></textarea>
        </div>
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Precio ($):</label>
            <input type="number" [(ngModel)]="nuevoTratamiento.precio" name="precio" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
          </div>
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Duración (min):</label>
            <input type="number" [(ngModel)]="nuevoTratamiento.duracionMinutos" name="duracionMinutos" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
          </div>
        </div>

        <button type="submit" style="background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold;">
          {{ editando ? 'ACTUALIZAR DATOS' : 'REGISTRAR TRATAMIENTO' }}
        </button>

        <button *ngIf="editando" type="button" (click)="resetearFormulario()" style="background: #6c757d; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px;">
          CANCELAR
        </button>
      </form>
    </div>

    <div [style.gridColumn]="esAdmin ? 'span 1' : 'span 2'" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="text-align: left; border-bottom: 2px solid #eee;">
            <th style="padding: 12px;">Tratamiento</th>
            <th style="padding: 12px;">Precio</th>
            <th style="padding: 12px;">Duración</th>
            <th *ngIf="esAdmin" style="padding: 12px; text-align: center;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tratamientos" style="border-bottom: 1px solid #f9f9f9;">
            <td style="padding: 12px;">
              <strong style="color: #2c3e50;">{{ t.nombre }}</strong><br>
              <small style="color: #888;">{{ t.descripcion }}</small>
            </td>
            <td style="padding: 12px; color: #28a745; font-weight: bold;">${{ t.precio }}</td>
            <td style="padding: 12px;">{{ t.duracionMinutos }} min</td>
            <td *ngIf="esAdmin" style="padding: 12px; text-align: center; display: flex; gap: 5px; justify-content: center;">
              <button (click)="editar(t)" style="background: #ffc107; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer;">Actualizar</button>
              <button (click)="eliminar(t.id)" style="background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer;">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
