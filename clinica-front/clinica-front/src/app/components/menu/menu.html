<div style="padding: 20px; font-family: Arial, sans-serif;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Panel de Citas Médicas</h2>
    <span *ngIf="esAdmin" style="background: #e3f2fd; color: #0d47a1; padding: 5px 10px; border-radius: 15px; font-size: 0.8em; font-weight: bold;">
      Modo Administrador
    </span>
  </div>

  <div *ngIf="mensajeError" style="background: #ffcccc; color: red; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
    {{ mensajeError }}
  </div>
  <div *ngIf="mensajeExito" style="background: #ccffcc; color: green; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
    {{ mensajeExito }}
  </div>

  <div style="display: flex; gap: 40px; flex-wrap: wrap;">
    
    <div style="flex: 1; min-width: 300px; background: #f9f9f9; padding: 20px; border-radius: 8px;">
      <h3>Agendar Nueva Cita</h3>
      <form (ngSubmit)="agendar()">
        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Nombre del Paciente:</label>
          <input type="text" [(ngModel)]="nuevaCita.nombrePaciente" name="nombrePaciente" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Correo Electrónico:</label>
          <input type="email" [(ngModel)]="nuevaCita.correo" name="correo" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Tratamiento:</label>
          <select [(ngModel)]="nuevaCita.tratamiento" name="tratamiento" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            <option value="" disabled selected>Seleccione un tratamiento</option>
            <option value="limpieza dental">Limpieza dental</option>
            <option value="ortodoncia">Ortodoncia</option>
            <option value="blanquiamiento">Blanquiamiento</option>
            <option value="implantes dentales">Implantes dentales</option>
          </select>
        </div>

        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Fecha:</label>
          <input type="date" [(ngModel)]="nuevaCita.fecha" name="fecha" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px;">Hora:</label>
          <input type="time" [(ngModel)]="nuevaCita.hora" name="hora" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button type="submit" style="background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; width: 100%;">
          Agendar Cita
        </button>
      </form>
    </div>

    <div style="flex: 2; min-width: 400px;">
      <h3>Citas Programadas</h3>
      <table *ngIf="citas.length > 0; else sinCitas" style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="background: #eee;">
            <th style="padding: 10px; border-bottom: 1px solid #ccc;">Paciente</th>
            <th style="padding: 10px; border-bottom: 1px solid #ccc;">Tratamiento</th>
            <th style="padding: 10px; border-bottom: 1px solid #ccc;">Fecha</th>
            <th style="padding: 10px; border-bottom: 1px solid #ccc;">Hora</th>
            <th *ngIf="esAdmin" style="padding: 10px; border-bottom: 1px solid #ccc;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cita of citas">
            <td style="padding: 10px; border-bottom: 1px solid #eee;">{{ cita.nombrePaciente }}</td>
            <td style="padding: 10px; border-bottom: 1px solid #eee; text-transform: capitalize;">{{ cita.tratamiento }}</td>
            <td style="padding: 10px; border-bottom: 1px solid #eee;">{{ cita.fecha }}</td>
            <td style="padding: 10px; border-bottom: 1px solid #eee;">{{ cita.hora }}</td>
            <td *ngIf="esAdmin" style="padding: 10px; border-bottom: 1px solid #eee;">
              <button (click)="eliminar(cita.id)" style="background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #sinCitas>
        <p style="color: #666;">No hay citas agendadas actualmente.</p>
      </ng-template>
    </div>

  </div>
</div>
